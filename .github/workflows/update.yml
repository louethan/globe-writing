name: Update Globe pieces

on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_feed.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain pieces.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add pieces.json
            git commit -m "Add new Globe pieces from RSS"
            git push
          fi
